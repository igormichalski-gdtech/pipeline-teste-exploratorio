<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Pipeline de teste exploratório</title>
<style>
body { margin:0; background:#fff; }
.wrap { width:1600px; background:#fff; }
svg { display:block; font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; }
.t { font-size:15px; font-weight:600; letter-spacing:.14em; fill:#9aa1a9; }
.name { font-size:22px; font-weight:700; fill:#1b1f24; text-anchor:middle; }
.cap { font-size:15px; fill:#7a828b; text-anchor:middle; }
.num { font-size:18px; font-weight:700; text-anchor:middle; dominant-baseline:central; }
.leg { font-size:13px; fill:#9aa1a9; }
.loop { font-size:13px; fill:#9aa1a9; text-anchor:middle; font-style:italic; }
</style></head><body><div class="wrap">
<svg width="1600" height="440" viewBox="0 0 1600 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#b8bfc6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="t" x="100" y="70">PIPELINE DE TESTE EXPLORATÓRIO</text>

  <!-- volta: a próxima execução aprende com as decisões -->
  <path d="M1460,190 C1460,120 1380,118 800,118 C220,118 140,120 140,190" fill="none" stroke="#d6dbe0" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#a)"/>
  <text class="loop" x="800" y="108">a próxima execução aprende com as decisões</text>

  <!-- setas entre etapas -->
  <g stroke="#b8bfc6" stroke-width="1.6" marker-end="url(#a)">
    <line x1="182" y1="230" x2="362" y2="230"/>
    <line x1="446" y1="230" x2="626" y2="230"/>
    <line x1="710" y1="230" x2="890" y2="230"/>
    <line x1="974" y1="230" x2="1154" y2="230"/>
    <line x1="1238" y1="230" x2="1418" y2="230"/>
  </g>

  <!-- pontos -->
  <g>
    <circle cx="140"  cy="230" r="30" fill="#eaf1fb"/><text class="num" x="140"  y="230" fill="#2b5ea7">1</text>
    <circle cx="404"  cy="230" r="30" fill="#eaf1fb"/><text class="num" x="404"  y="230" fill="#2b5ea7">2</text>
    <circle cx="668"  cy="230" r="30" fill="#fcefe6"/><text class="num" x="668"  y="230" fill="#c0612b">3</text>
    <circle cx="932"  cy="230" r="30" fill="#fcefe6"/><text class="num" x="932"  y="230" fill="#c0612b">4</text>
    <circle cx="1196" cy="230" r="30" fill="#eaf1fb"/><text class="num" x="1196" y="230" fill="#2b5ea7">5</text>
    <circle cx="1460" cy="230" r="30" fill="#eaf1fb"/><text class="num" x="1460" y="230" fill="#2b5ea7">6</text>
  </g>

  <!-- nomes e legendas -->
  <text class="name" x="140"  y="305">Preparar</text><text class="cap" x="140"  y="332">mapeia o ambiente</text>
  <text class="name" x="404"  y="305">Planejar</text><text class="cap" x="404"  y="332">personas e missões</text>
  <text class="name" x="668"  y="305">Explorar</text><text class="cap" x="668"  y="332">usa só a tela</text>
  <text class="name" x="932"  y="305">Verificar</text><text class="cap" x="932"  y="332">reproduz o achado</text>
  <text class="name" x="1196" y="305">Triar</text><text class="cap" x="1196" y="332">bug, dúvida ou sugestão</text>
  <text class="name" x="1460" y="305">Relatar</text><text class="cap" x="1460" y="332">relatório e limpeza</text>

  <!-- legenda -->
  <circle cx="106" cy="396" r="6" fill="#2b5ea7"/><text class="leg" x="120" y="400">lê o código</text>
  <circle cx="226" cy="396" r="6" fill="#c0612b"/><text class="leg" x="240" y="400">só a tela, como um usuário</text>
</svg>
</div></body></html>
